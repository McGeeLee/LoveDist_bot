[project]
name = "lovedist-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22.8,<23",
  "sqlalchemy[asyncio]>=2.1.6,<3",
  "aiosqlite>=0.22.1,<1",
  "python-dotenv>=1.2.4,<2",
]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "pytest-asyncio>=1.4.1,<2", "ruff>=0.17.3,<1"]

[tool.uv]
# Keep the HTTP client's CA bundle above the emSign root-removal security release.
constraint-dependencies = ["certifi>=2026.10.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
