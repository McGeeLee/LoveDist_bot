[project]
name = "lovedist-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22.8,<23",
  "sqlalchemy[asyncio]>=2.1.5,<3",
  "aiosqlite>=0.22.1,<1",
  "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
